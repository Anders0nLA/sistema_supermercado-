<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | Supermercado</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="/">Supermercado</a>
    <nav aria-label="Principal">
      <a href="/">Loja</a>
      <a href="/admin" aria-current="page">Administração</a>
    </nav>
    <div class="conta">
      <span class="conta-nome"><span id="usuarioNome"></span><span class="conta-papel" id="usuarioPapel"></span></span>
      <a href="/sair">Sair</a>
    </div>
  </header>

  <main class="admin">
    <section class="ficha" id="ficha" aria-labelledby="tituloForm">
      <h1 id="tituloForm">Novo produto</h1>
      <p class="dica" id="dicaForm">Preencha os dados para colocar o produto à venda.</p>

      <form id="formProduto" novalidate>
        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex.: Arroz 5kg" required autocomplete="off">
        </div>

        <div class="campos-lado">
          <div class="campo">
            <label for="preco">Preço (R$)</label>
            <input type="number" id="preco" step="0.01" min="0" placeholder="0,00" required inputmode="decimal">
          </div>
          <div class="campo">
            <label for="estoque">Estoque</label>
            <input type="number" id="estoque" step="1" min="0" placeholder="0" required inputmode="numeric">
          </div>
        </div>

        <button type="submit" class="btn-primario" id="btnSalvar">Cadastrar produto</button>
        <button type="button" class="btn-secundario" id="btnCancelar" hidden>Cancelar edição</button>
      </form>

      <p id="msg" class="msg" role="status" hidden></p>
    </section>

    <section aria-labelledby="titulo-lista">
      <div class="lista-topo">
        <h2 id="titulo-lista">Produtos cadastrados</h2>
        <p id="resumo"></p>
      </div>

      <div class="tabela-rolagem">
        <table>
          <thead>
            <tr>
              <th scope="col">Cód.</th>
              <th scope="col">Produto</th>
              <th scope="col" class="num">Preço</th>
              <th scope="col" class="num">Estoque</th>
              <th scope="col"><span class="sr-only">Ações</span></th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/sessao.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
