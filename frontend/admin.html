<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supermercado - Administração</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>⚙️ Administração de Produtos</h1>
    <a href="loja.html">Voltar para a loja</a>
  </header>

  <main>
    <section class="painel form-painel">
      <h2 id="tituloForm">Novo produto</h2>

      <form id="formProduto">
        <label for="nome">Nome</label>
        <input type="text" id="nome" placeholder="Ex.: Arroz 5kg" required>

        <label for="preco">Preço (R$)</label>
        <input type="number" id="preco" step="0.01" min="0" placeholder="0,00" required>

        <label for="estoque">Quantidade em estoque</label>
        <input type="number" id="estoque" step="1" min="0" placeholder="0" required>

        <button type="submit" class="btn-salvar" id="btnSalvar">Salvar produto</button>
        <button type="button" class="btn-cancelar" id="btnCancelar" hidden>Cancelar edição</button>
      </form>

      <div id="msg"></div>
    </section>

    <section class="painel lista-painel">
      <h2>Produtos cadastrados</h2>
      <div class="tabela-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Nome</th>
              <th>Preço</th>
              <th>Estoque</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="tabelaProdutos"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="js/admin.js"></script>
</body>
</html>
